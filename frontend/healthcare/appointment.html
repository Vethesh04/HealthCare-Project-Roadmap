<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | Health Care+</title>

    <link rel="stylesheet" href="../css/appointment.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse "></i>
                <span>HEALTHCARE+</span> 
            </div>
            <div class="list">
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./doctors.html">Doctor</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </div>
            <a href="appointment.html" class="btn">
                Book Appointment
            </a>
        </nav>
    </header>
    <!-- ================= HERO ================= -->

    

    <!-- ================= FORM ================= -->

    <section class="appointment">

        <div class="form-container">

            <h2>Appointment Form</h2>

            <form id="appointmentForm">

                <div class="input-box">

                    <label>Patient Name</label>

                    <input type="text" id="name" placeholder="Enter Full Name">
                    <span class="error" id="nameError"></span>
                </div>

                <div class="input-box">

                    <label>Email Address</label>

                    <input type="email" id="email" placeholder="Enter Email">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="input-box">

                    <label>Phone Number</label>

                    <input type="text" id="phone" placeholder="Enter Mobile Number">
                    <span class="error" id="phoneError"></span>

                </div>

                <div class="input-box">

                    <label>Gender</label>

                    <select id="gender">

                        <option value="">Select Gender</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Age</label>

                    <input type="number" id="age" placeholder="Enter Age">

                </div>

                <div class="input-box">

                    <label>Department</label>

                    <select id="department">

                        <option value="">Select Department</option>

                        <option>Cardiology</option>

                        <option>Neurology</option>

                        <option>Orthopedics</option>

                        <option>Pediatrics</option>

                        <option>Dermatology</option>

                        <option>General Medicine</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Select Doctor</label>

                    <select id="doctor">

                        <option value="">Choose Doctor</option>

                        <option>Dr. John</option>

                        <option>Dr. Sarah</option>

                        <option>Dr. David</option>

                        <option>Dr. Emily</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Appointment Date</label>

                    <input type="date" id="date">

                </div>

                <div class="input-box">

                    <label>Preferred Time</label>

                    <select id="time">

                        <option value="">Choose Time</option>

                        <option>09:00 AM</option>

                        <option>10:00 AM</option>

                        <option>11:00 AM</option>

                        <option>02:00 PM</option>

                        <option>03:00 PM</option>

                        <option>04:00 PM</option>

                    </select>

                </div>

                <div class="input-box full">

                    <label>Health Problem</label>

                    <textarea id="problem" rows="5" placeholder="Describe your problem"></textarea>

                </div>

                <div class="buttons">

                    <button type="submit" class="btn">

                        Book Appointment

                    </button>

                    <button type="reset" class="btn reset">

                        Reset

                    </button>

                </div>

            </form>

        </div>

    </section>

    <!-- ================= SUCCESS POPUP ================= -->

    <div class="popup" id="popup">

        <div class="popup-content">

            <i class="fa-solid fa-circle-check"></i>

            <h2>Appointment Booked!</h2>

            <p>

                Thank you for choosing Health Care+.
                Our team will contact you shortly.

            </p>

            <button id="closePopup">

                OK

            </button>

        </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Health Care+ | All Rights Reserved.

        </p>

    </footer>

    <script src="../javaScript/appointment.js"></script>

</body>

</html>
